<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100 Fontes de Renda no Brasil — Outubro de 2026</title>
<style>
:root{--bg:#0b0d12;--card:#141821;--line:#232a36;--tx:#e7eaf0;--mu:#97a0b0;--ac:#38e08c;--ac2:#7c5cff}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(900px 500px at 10% 0,#38e08c1c,transparent),radial-gradient(900px 500px at 95% 100%,#7c5cff22,transparent),var(--bg)}
.s{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 6vw 80px;opacity:0;transform:translateX(60px) scale(.98);transition:opacity .45s,transform .45s;pointer-events:none;overflow:auto}
.s.on{opacity:1;transform:none;pointer-events:auto}.s.prev{transform:translateX(-60px) scale(.98)}
.in{max-width:1000px;width:100%}h1{font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.05;margin:0 0 20px;letter-spacing:-.02em}
.g{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
h2{font-size:clamp(1.6rem,4vw,2.8rem);margin:0 0 22px;line-height:1.1}.lead{color:var(--mu);font-size:clamp(1rem,2vw,1.3rem);line-height:1.55}
ul{padding-left:20px;font-size:clamp(.95rem,1.8vw,1.2rem);line-height:1.6}li{margin:10px 0}
.warn{border:1px solid #e0b43855;background:#1d1a10cc;border-radius:20px;padding:28px;font-size:clamp(1rem,1.9vw,1.25rem);line-height:1.6;color:#e6dcc0}
.toc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toc a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--tx);text-decoration:none;cursor:pointer}.toc a:hover{border-color:var(--ac)}.toc small{color:var(--mu)}
.kick{color:var(--ac);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;margin-bottom:12px}
.big{font-size:clamp(5rem,16vw,11rem);font-weight:800;line-height:1;opacity:.12;margin-bottom:-.35em}
.num{font-size:clamp(3rem,8vw,5.5rem);font-weight:800;line-height:1}
.desc{font-size:clamp(1.05rem,2.2vw,1.45rem);line-height:1.55;color:#d3d9e3;margin:0 0 22px}
.pp{border-left:3px solid var(--ac2);padding:4px 0 4px 16px;color:var(--mu);font-size:clamp(.95rem,1.8vw,1.15rem);line-height:1.55;margin-bottom:26px}.pp b{color:var(--tx)}
.m{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.m div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.m small{display:block;color:var(--mu);font-size:.8rem;margin-bottom:4px}.m b{font-size:1.15rem}
#bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s;z-index:10}
.ui{position:fixed;bottom:16px;right:16px;display:flex;gap:8px;align-items:center;z-index:10}.ui button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 14px;font-size:1rem;cursor:pointer}.ui button:hover{border-color:var(--ac)}
#cnt{color:var(--mu);font-size:.9rem;margin-right:6px;font-variant-numeric:tabular-nums}
#ov{position:fixed;inset:0;background:#0b0d12f5;z-index:20;display:none;overflow:auto;padding:30px 5vw}#ov.on{display:block}
#ov h3{margin:0 0 16px}#ov .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
#ov a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.85rem;color:var(--tx);text-decoration:none;cursor:pointer}#ov a.cur{border-color:var(--ac)}#ov a.sec{color:var(--ac);font-weight:700}
@media(max-width:700px){.toc,.m{grid-template-columns:1fr}.s{align-items:flex-start;padding-top:50px}}
</style></head><body><div id="bar"></div><div id="deck"></div>
<div class="ui"><span id="cnt"></span><button id="bo" title="Visão geral (O)">▦</button><button id="bp" aria-label="Anterior">←</button><button id="bn" aria-label="Próximo">→</button></div>
<div id="ov"><h3>Índice de slides <small style="color:var(--mu);font-weight:400">— O / Esc para fechar</small></h3><div class="gr" id="ovg"></div></div>
<script>
const D=[{"n": 1, "t": "Agência de automação com IA para PMEs", "cat": "Inteligência Artificial e Automação", "d": "Automatizar processos repetitivos (atendimento, agendamento, follow-up, planilhas) de pequenos negócios com n8n, Make ou Zapier integrados a modelos de IA.", "p": "Mapear 3 processos manuais de um comércio local conhecido e oferecer um piloto com preço fechado.", "inv": "Baixo", "tempo": "2–6 semanas", "pot": "Alto"}, {"n": 2, "t": "Chatbots de atendimento no WhatsApp", "cat": "Inteligência Artificial e Automação", "d": "Montar assistentes com IA no WhatsApp Business (API oficial) para clínicas, restaurantes, imobiliárias e lojas responderem dúvidas e agendarem 24h.", "p": "Criar uma demonstração funcional para um nicho (ex.: clínica odontológica) e gravar um vídeo de 2 minutos mostrando o fluxo.", "inv": "Baixo", "tempo": "2–6 semanas", "pot": "Alto"}, {"n": 3, "t": "Agente de IA para qualificação de leads (SDR com IA)", "cat": "Inteligência Artificial e Automação", "d": "Configurar agentes que respondem leads de formulários e anúncios, qualificam e passam para o vendedor humano no CRM.", "p": "Escolher um CRM popular (ex.: HubSpot, RD Station, Pipedrive) e montar um fluxo de qualificação de exemplo.", "inv": "Baixo", "tempo": "1–2 meses", "pot": "Alto"}, {"n": 4, "t": "Treinamento corporativo em IA generativa", "cat": "Inteligência Artificial e Automação", "d": "Capacitar equipes de empresas a usar assistentes de IA (ChatGPT, Claude, Grok, Gemini, Copilot) com segurança e produtividade.", "p": "Montar um roteiro de workshop de 3 horas e oferecer uma sessão gratuita para uma empresa da sua rede em troca de depoimento.", "inv": "Baixo", "tempo": "2–8 semanas", "pot": "Alto"}, {"n": 5, "t": "Workshops de IA para profissões específicas", "cat": "Inteligência Artificial e Automação", "d": "Cursos ao vivo de IA aplicada a nichos (advogados, contadores, corretores, professores), com casos práticos da área.", "p": "Escolher uma profissão, entrevistar 5 profissionais sobre suas tarefas chatas e montar a ementa a partir disso.", "inv": "Baixo", "tempo": "3–8 semanas", "pot": "Médio a Alto"}, {"n": 6, "t": "Micro-SaaS com IA para um nicho", "cat": "Inteligência Artificial e Automação", "d": "Software por assinatura que resolve um problema pontual usando IA (ex.: gerar propostas comerciais, resumir laudos, responder avaliações).", "p": "Validar a dor com uma landing page e lista de espera antes de programar; meta inicial de 20 inscritos.", "inv": "Médio", "tempo": "2–6 meses", "pot": "Muito alto"}, {"n": 7, "t": "Venda de templates de workflows de automação", "cat": "Inteligência Artificial e Automação", "d": "Pacotes prontos de fluxos para n8n, Make ou Zapier (ex.: \"captação de leads + CRM + e-mail\"), com tutorial em vídeo.", "p": "Exportar 3 automações que você já usa, documentar e publicar em Gumroad, Hotmart ou no marketplace da própria ferramenta.", "inv": "Baixo", "tempo": "2–6 semanas", "pot": "Médio"}, {"n": 8, "t": "Assistentes personalizados e bibliotecas de prompts", "cat": "Inteligência Artificial e Automação", "d": "Criar GPTs/projetos/assistentes configurados para tarefas de nicho e vender acesso, configuração ou pacotes de prompts testados.", "p": "Construir um assistente para uma tarefa específica (ex.: briefing de campanhas) e testar com 5 usuários reais.", "inv": "Baixo", "tempo": "2–6 semanas", "pot": "Baixo a Médio"}, {"n": 9, "t": "Implantação de base de conhecimento com IA (RAG)", "cat": "Inteligência Artificial e Automação", "d": "Conectar documentos internos (manuais, contratos, FAQs) a um assistente de IA para que a equipe consulte informações rapidamente.", "p": "Construir uma prova de conceito com documentos públicos de um setor e apresentar para 3 empresas médias.", "inv": "Médio", "tempo": "1–3 meses", "pot": "Alto"}, {"n": 10, "t": "Transcrição, legendagem e dublagem com IA", "cat": "Inteligência Artificial e Automação", "d": "Transcrever, legendar e dublar vídeos e podcasts com IA, com revisão humana para garantir qualidade.", "p": "Oferecer legendagem de um vídeo gratuito para um criador médio e usar como portfólio.", "inv": "Baixo", "tempo": "1–3 semanas", "pot": "Médio"}, {"n": 11, "t": "Avaliação e anotação de dados para IA", "cat": "Inteligência Artificial e Automação", "d": "Trabalho remoto avaliando respostas de modelos, escrevendo exemplos e rotulando dados para empresas de IA (vagas e pagamentos variam por país e especialidade).", "p": "Cadastrar-se em 2–3 plataformas reconhecidas de anotação de dados e fazer os testes de qualificação com calma.", "inv": "Baixo", "tempo": "2–6 semanas", "pot": "Baixo a Médio"}, {"n": 12, "t": "Relatórios e dashboards automatizados com IA", "cat": "Inteligência Artificial e Automação", "d": "Integrar dados de vendas, financeiro e marketing em painéis (Looker Studio, Power BI, Sheets) com resumos automáticos gerados por IA.", "p": "Montar um dashboard modelo para e-commerce com dados fictícios e usá-lo como demonstração.", "inv": "Baixo", "tempo": "3–8 semanas", "pot": "Médio a Alto"}, {"n": 13, "t": "Extensões de navegador com IA", "cat": "Inteligência Artificial e Automação", "d": "Desenvolver extensões para Chrome que usam IA para tarefas do dia a dia (resumir páginas, responder e-mails, extrair dados), monetizadas por assinatura.", "p": "Listar 10 tarefas repetitivas que você faz no navegador e prototipar uma extensão para a mais dolorosa.", "inv": "Baixo", "tempo": "2–4 meses", "pot": "Médio a Alto"}, {"n": 14, "t": "Consultoria de governança de IA e LGPD", "cat": "Inteligência Artificial e Automação", "d": "Ajudar empresas a definir políticas de uso de IA, riscos, proteção de dados pessoais e conformidade com a LGPD.", "p": "Criar um checklist de \"uso seguro de IA\" em PDF e distribuir no LinkedIn para gerar conversas comerciais.", "inv": "Baixo", "tempo": "1–3 meses", "pot": "Alto"}, {"n": 15, "t": "Fotos e descrições de produto com IA para lojistas", "cat": "Inteligência Artificial e Automação", "d": "Gerar fotos de produto em cenários, fundos limpos e descrições otimizadas para marketplaces usando IA.", "p": "Refazer gratuitamente as fotos de 5 produtos de um lojista do Mercado Livre e mostrar o antes/depois.", "inv": "Baixo", "tempo": "1–3 semanas", "pot": "Médio"}, {"n": 16, "t": "Desenvolvedor de programas na Solana (Rust/Anchor)", "cat": "Cripto e Ecossistema Solana", "d": "Freelance ou contratação para escrever e manter programas (smart contracts) na Solana; mercado frequentemente paga em dólar ou stablecoins.", "p": "Concluir um curso gratuito de Solana/Anchor e publicar um projeto simples no GitHub com deploy na devnet.", "inv": "Baixo", "tempo": "2–6 meses", "pot": "Muito alto"}, {"n": 17, "t": "Ferramentas de monitoramento on-chain por assinatura", "cat": "Cripto e Ecossistema Solana", "d": "Bots e painéis de alertas (movimentação de carteiras, novos pools, preços) entregues via Telegram ou Discord para traders e projetos.", "p": "Criar um bot de alertas de carteira em uma API de dados da Solana e oferecer acesso grátis a 20 testadores.", "inv": "Baixo", "tempo": "1–3 meses", "pot": "Médio a Alto"}, {"n": 18, "t": "Staking de SOL", "cat": "Cripto e Ecossistema Solana", "d": "Delegar SOL a validadores (staking nativo) ou usar liquid staking para receber recompensas; o preço do ativo é volátil e o principal não é garantido.", "p": "Estudar a diferença entre staking nativo e liquid staking e começar com um valor pequeno que você aceita ver oscilar.", "inv": "Médio", "tempo": "Dias (recompensas por época)", "pot": "Baixo a Médio"}, {"n": 19, "t": "Operação de validador Solana", "cat": "Cripto e Ecossistema Solana", "d": "Rodar infraestrutura de validador e cobrar comissão sobre o stake delegado; exige servidor robusto, conhecimento técnico e custos fixos relevantes.", "p": "Rodar um nó na testnet e participar de programas de delegação para validadores antes de colocar capital próprio.", "inv": "Alto", "tempo": "3–12 meses", "pot": "Médio a Alto"}, {"n": 20, "t": "Bounties e hackathons do ecossistema", "cat": "Cripto e Ecossistema Solana", "d": "Executar tarefas pagas (desenvolvimento, design, conteúdo, tradução) em plataformas de bounties como as da Superteam e competir em hackathons globais.", "p": "Criar perfil na plataforma de bounties da Superteam e entrar na comunidade Superteam Brasil.", "inv": "Baixo", "tempo": "2–8 semanas", "pot": "Médio a Alto"}, {"n": 21, "t": "Newsletter/pesquisa de cripto paga", "cat": "Cripto e Ecossistema Solana", "d": "Análises on-chain, relatórios de projetos e resumos semanais em português para investidores, vendidos por assinatura (sem recomendação de investimento personalizada).", "p": "Publicar 4 edições gratuitas seguidas e medir abertura e respostas antes de abrir plano pago.", "inv": "Baixo", "tempo": "2–4 meses", "pot": "Médio a Alto"}, {"n": 22, "t": "Redação técnica e documentação para projetos Web3", "cat": "Cripto e Ecossistema Solana", "d": "Escrever docs, tutoriais, artigos e traduções em português para protocolos que querem crescer no Brasil.", "p": "Escrever um tutorial em português de um protocolo Solana conhecido e enviar ao time do projeto.", "inv": "Baixo", "tempo": "2–6 semanas", "pot": "Médio"}, {"n": 23, "t": "Bug bounty e auditoria de contratos", "cat": "Cripto e Ecossistema Solana", "d": "Encontrar vulnerabilidades em contratos inteligentes por programas oficiais de recompensa (ex.: Immunefi) ou atuar em auditorias.", "p": "Estudar relatórios públicos de auditorias Solana e resolver desafios de segurança (CTFs) para treinar.", "inv": "Baixo", "tempo": "3–12 meses", "pot": "Muito alto"}, {"n": 24, "t": "Provisão de liquidez em DEXs", "cat": "Cripto e Ecossistema Solana", "d": "Fornecer liquidez em DEXs da Solana (ex.: Orca, Raydium, Meteora) para receber taxas; envolve risco de perda impermanente, volatilidade e risco de contrato.", "p": "Simular posições com valores mínimos e acompanhar por 30 dias o resultado versus simplesmente segurar os ativos.", "inv": "Médio", "tempo": "Dias", "pot": "Baixo a Médio"}, {"n": 25, "t": "Arte digital e coleções NFT", "cat": "Cripto e Ecossistema Solana", "d": "Criar e vender arte digital, edições colecionáveis ou itens com utilidade real (ingressos, acesso a comunidade) na Solana.", "p": "Publicar 5 peças em um marketplace e divulgar o processo criativo no X.", "inv": "Baixo", "tempo": "1–3 meses", "pot": "Baixo a Alto"}, {"n": 26, "t": "Relatórios de cripto para declaração de impostos", "cat": "Cripto e Ecossistema Solana", "d": "Organizar o histórico de transações de clientes e gerar relatórios para o contador cumprir as obrigações com a Receita Federal (parcerias com contadores).", "p": "Organizar o próprio histórico de transações com uma ferramenta de rastreamento e oferecer o serviço a 3 amigos que investem.", "inv": "Baixo", "tempo": "1–2 meses", "pot": "Médio"}, {"n": 27, "t": "Integração de pagamentos cripto para lojistas", "cat": "Cripto e Ecossistema Solana", "d": "Implantar Solana Pay ou gateways de stablecoins em lojas online e físicas, com conversão e conformidade orientadas.", "p": "Montar uma loja de teste com checkout em USDC na devnet e gravar a demonstração.", "inv": "Baixo", "tempo": "1–3 meses", "pot": "Médio"}, {"n": 28, "t": "Participação em testnets e programas de pontos", "cat": "Cripto e Ecossistema Solana", "d": "Testar protocolos novos, reportar bugs e dar feedback; alguns projetos recompensam participantes, mas não há garantia e é preciso evitar golpes de \"airdrop\".", "p": "Usar uma carteira separada, sem fundos relevantes, e acompanhar apenas anúncios em canais oficiais dos projetos.", "inv": "Baixo", "tempo": "Incerto (meses)", "pot": "Baixo a Médio"}, {"n": 29, "t": "Monetização de criador no X", "cat": "X/Twitter e Criação de Conteúdo", "d": "Receita da divisão de anúncios e assinaturas de criador no X, disponível para contas que cumprem os requisitos vigentes da plataforma.", "p": "Conferir os requisitos atuais de monetização e definir um nicho com meta de publicação diária por 90 dias.", "inv": "Baixo", "tempo": "2–6 meses", "pot": "Baixo a Alto"}, {"n": 30, "t": "Ghostwriting para X", "cat": "X/Twitter e Criação de Conteúdo", "d": "Escrever posts e threads para fundadores, investidores e especialistas que não têm tempo de manter presença.", "p": "Reescrever 3 posts de um fundador que você admira e enviar por DM como amostra, sem compromisso.", "inv": "Baixo", "tempo": "2–6 semanas", "pot": "Alto"}, {"n": 31, "t": "Gestão de perfis e crescimento no X para marcas", "cat": "X/Twitter e Criação de Conteúdo", "d": "Estratégia, calendário, interação diária e análise de métricas para contas de empresas e projetos.", "p": "Montar um estudo de caso do crescimento da sua própria conta com números reais do painel do X.", "inv": "Baixo", "tempo": "1–2 meses", "pot": "Médio a Alto"}, {"n": 32, "t": "Newsletter paga de nicho", "cat": "X/Twitter e Criação de Conteúdo", "d": "Newsletter em Substack ou Beehiiv sobre IA, cripto ou outro nicho, monetizada por assinatura, patrocínio e indicação.", "p": "Definir a promessa da newsletter em uma frase e lançar a primeira edição para seus seguidores atuais.", "inv": "Baixo", "tempo": "2–6 meses", "pot": "Médio a Alto"}, {"n": 33, "t": "Canal no YouTube sobre IA/cripto em português", "cat": "X/Twitter e Criação de Conteúdo", "d": "Tutoriais, notícias e análises em vídeo; renda via AdSense, patrocínios, afiliados e membros.", "p": "Gravar 3 tutoriais de ferramentas de IA com boa busca em português e publicar com títulos otimizados.", "inv": "Baixo", "tempo": "3–9 meses", "pot": "Alto"}, {"n": 34, "t": "Cortes e clipping de vídeos", "cat": "X/Twitter e Criação de Conteúdo", "d": "Editar cortes curtos de lives e podcasts para criadores ou participar de programas de clipping que pagam por visualização.", "p": "Escolher um podcast popular que autoriza cortes e publicar 10 cortes em uma conta dedicada.", "inv": "Baixo", "tempo": "2–6 semanas", "pot": "Baixo a Médio"}, {"n": 35, "t": "Publis "pot": "Baixo a Médio"}, {"n": 98, "t": "Aluguel de vaga de garagem ou espaço de armazenamento", "cat": "Renda Passiva e Investimentos", "d": "Alugar vagas, depósitos ou espaços ociosos para moradores, comércios ou estocagem de e-commerce.", "p": "Confirmar se o condomínio permite e anunciar a vaga em grupos do bairro e classificados.", "inv": "Baixo", "tempo": "1–4 semanas", "pot": "Baixo"}, {"n": 99, "t": "Debêntures incentivadas, CRIs e CRAs", "cat": "Renda Passiva e Investimentos", "d": "Títulos de crédito privado, muitos isentos de IR para pessoa física, que costumam pagar acima dos títulos públicos com mais risco de crédito.", "p": "Estudar a fundo o risco de crédito do emissor e começar com uma parcela pequena da carteira de renda fixa.", "inv": "Médio", "tempo": "Imediato a meses", "pot": "Médio"}, {"n": 100, "t": "Aluguel de GPU ociosa para computação de IA", "cat": "Renda Passiva e Investimentos", "d": "Disponibilizar placas de vídeo potentes em marketplaces de computação (ex.: Vast.ai) para quem treina ou roda modelos de IA; custo de energia e desgaste pesam.", "p": "Calcular o consumo de energia da sua GPU e comparar com os preços praticados no marketplace antes de cadastrar.", "inv": "Alto", "tempo": "Dias", "pot": "Baixo a Médio"}],C=["Inteligência Artificial e Automação", "Cripto e Ecossistema Solana", "X/Twitter e Criação de Conteúdo", "LinkedIn, Carreira e B2B", "Discord e Comunidades", "Influenciadores Sintéticos e Mídia Gerada por IA", "Produtos Digitais", "Freelas e Serviços Profissionais", "E-commerce e Produtos Físicos", "Renda Passiva e Investimentos"],TOT="Total: 100 fontes de renda distintas. Documento gerado em 20/10/2026.",$=s=>document.querySelector(s);
const e=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const S=[];const add=(lab,h,sec)=>S.push({lab,h,sec});
add('Capa',`<h1>100 Fontes de Renda no Brasil — <span class="g">Outubro de 2026</span></h1><p class="lead">Guia de ideias realistas e legais, com foco em IA, cripto (Solana), X/Twitter, LinkedIn, Discord, influenciadores sintéticos e automação, além de opções tradicionais.</p><p class="lead" style="font-size:.95rem">Use ← → ou deslize para navegar · O para o índice</p>`,1);
add('Como ler este guia',`<h2>Como ler este guia</h2><ul><li><b>Investimento inicial:</b> Baixo (até alguns poucos milhares de reais, muitas vezes só tempo, computador e internet), Médio (alguns milhares a dezenas de milhares) ou Alto (dezenas de milhares ou mais, ou exige um ativo como imóvel ou hardware caro).</li><li><b>Tempo até a primeira renda:</b> estimativa típica para quem executa com consistência; varia bastante.</li><li><b>Potencial:</b> faixa qualitativa (Baixo, Médio, Alto, Muito alto) do teto de renda que a atividade costuma permitir. Não é promessa de ganho.</li></ul>`,1);
add('Avisos importantes',`<h2>⚠️ Avisos importantes</h2><div class="warn">Nada aqui é recomendação de investimento. Cripto e renda variável são voláteis e podem gerar perdas. Formalize sua atividade (MEI, ME ou carnê-leão, conforme o caso), declare rendimentos à Receita Federal, sinalize publicidade (CONAR) e conteúdo gerado por IA, respeite a LGPD e os termos de cada plataforma. Desconfie de qualquer "oportunidade" que prometa retorno garantido, exija recrutar pessoas ou peça sua seed phrase.</div>`,1);
const tocAt=S.length;add('Sumário','',1);const secIdx=[];
C.forEach((c,i)=>{const it=D.filter(d=>d.cat==c);secIdx.push(S.length);
add(`${i+1}. ${c}`,`<div class="big">${String(i+1).padStart(2,'0')}</div><div class="kick">Categoria ${i+1} de ${C.length}</div><h1>${e(c)}</h1><p class="lead">Itens ${it[0].n}–${it.at(-1).n}</p>`,1);
it.forEach(d=>add(`${d.n}. ${d.t}`,`<div class="kick">${i+1}. ${e(c)}</div><div class="num g">${d.n}</div><h2>${e(d.t)}</h2><p class="desc">${e(d.d)}</p><div class="pp"><b>Primeiro passo:</b> ${e(d.p)}</div><div class="m"><div><small>💰 Investimento inicial</small><b>${e(d.inv)}</b></div><div><small>⏱ Tempo até a primeira renda</small><b>${e(d.tempo)}</b></div><div><small>📈 Potencial</small><b>${e(d.pot)}</b></div></div>`))});
S[tocAt].h=`<h2>Sumário</h2><div class="toc">`+C.map((c,i)=>{const it=D.filter(d=>d.cat==c);return`<a data-go="${secIdx[i]}">${i+1}. ${e(c)} <small>(itens ${it[0].n}–${it.at(-1).n})</small></a>`}).join('')+`</div>`;
add('Encerramento',`<h1><span class="g">${e(TOT.split('.')[0])}.</span></h1><p class="lead">${e(TOT.split('. ').slice(1).join('. '))}</p><p class="lead">Nada aqui é recomendação de investimento.</p>`,1);
$('#deck').innerHTML=S.map(s=>`<section class="s"><div class="in">${s.h}</div></section>`).join('');
$('#ovg').innerHTML=S.map((s,i)=>`<a data-go="${i}" class="${s.sec?'sec':''}">${i+1}. ${e(s.lab)}</a>`).join('');
const els=[...document.querySelectorAll('.s')];let cur=0;
function go(n){n=Math.max(0,Math.min(S.length-1,n));cur=n;els.forEach((el,i)=>{el.classList.toggle('on',i==n);el.classList.toggle('prev',i<n)});
$('#bar').style.width=(n/(S.length-1)*100)+'%';$('#cnt').textContent=`${n+1} / ${S.length}`;
document.querySelectorAll('#ovg a').forEach((a,i)=>a.classList.toggle('cur',i==n));if(location.hash!='#'+(n+1))history.replaceState(null,'','#'+(n+1))}
const ov=t=>{$('#ov').classList.toggle('on',t);if(t)$('#ovg a.cur')?.scrollIntoView({block:'center'})};
document.addEventListener('click',ev=>{const a=ev.target.closest('[data-go]');if(a){go(+a.dataset.go);ov(false)}});
$('#bn').onclick=()=>go(cur+1);$('#bp').onclick=()=>go(cur-1);$('#bo').onclick=()=>ov(!$('#ov').classList.contains('on'));
addEventListener('keydown',k=>{const o=$('#ov').classList.contains('on');
if(k.key=='o'||k.key=='O')ov(!o);else if(k.key=='Escape')ov(false);else if(o)return;
else if(['ArrowRight','PageDown',' '].includes(k.key)){k.preventDefault();go(cur+1)}else if(['ArrowLeft','PageUp'].includes(k.key))go(cur-1);else if(k.key=='Home')go(0);else if(k.key=='End')go(S.length-1)});
let tx=0,ty=0;addEventListener('touchstart',t=>{tx=t.touches[0].clientX;ty=t.touches[0].clientY},{passive:true});
addEventListener('touchend',t=>{const dx=t.changedTouches[0].clientX-tx,dy=t.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(cur+(dx<0?1:-1))});
go((parseInt(location.hash.slice(1))||1)-1);
